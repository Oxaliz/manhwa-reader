<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Manhwa Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .title {
      text-align: center;
      padding: 18px 10px;
      font-size: 22px;
      font-weight: bold;
      background: #181818;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .reader {
      width: 100%;
      max-width: 900px;
      margin: auto;
    }

    .reader img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }
  </style>
</head>

<body>

  <div class="title">Chapter 1</div>

  <div class="reader">

    <img src="https://placehold.co/900x1300?text=PAGE+1">
    <img src="https://placehold.co/900x1300?text=PAGE+2">
    <img src="https://placehold.co/900x1300?text=PAGE+3">

  </div>

</body>
  </html>
