<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToonNest — Manhwa Reader</title>
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      transition: 0.3s;
      user-select: none; /* စာသားရွေးလို့မရအောင် */
    }
    :root {
      --bg: #0b0b0f;
      --bg2: #12121a;
      --bg3: #1a1a28;
      --border: #2a2a3a;
      --text: #eee;
      --text2: #aaa;
      --primary: #ff6b8a;
      --primary2: #d98ac8;
      --shadow: rgba(255,107,138,0.15);
      --radius: 16px;
      --transition: 0.3s ease;
    }
    .light {
      --bg: #f5f0f7;
      --bg2: #ffffff;
      --bg3: #f0ebf2;
      --border: #ddd;
      --text: #222;
      --text2: #555;
      --shadow: rgba(0,0,0,0.08);
    }
    body { background: var(--bg); color: var(--text); }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    /* ===== HEADER ===== */
    .header {
      background: linear-gradient(135deg, #1a0b1f, #2d1b33);
      padding: 28px 20px 18px;
      text-align: center;
      border-bottom: 2px solid var(--primary);
    }
    .logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ===== NAV ===== */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
      backdrop-filter: blur(8px);
    }
    .nav-left { display: flex; align-items: center; gap: 12px; }
    .menu-btn {
      background: none; border: none; color: var(--text); font-size: 26px;
      cursor: pointer; transition: var(--transition);
    }
    .menu-btn:hover { color: var(--primary); }
    .nav-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      background: var(--bg3);
      padding: 4px 14px;
      border-radius: 30px;
    }
    .nav-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .premium-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 15px rgba(255,107,138,0.3);
    }
    .premium-btn:hover { transform: scale(1.05); box-shadow: 0 6px 25px rgba(255,107,138,0.5); }
    .theme-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 16px;
      transition: var(--transition);
    }
    .theme-btn:hover { border-color: var(--primary); }

    /* ===== SEARCH + FILTER ===== */
    .search-area {
      max-width: 1100px;
      margin: 24px auto 0;
      padding: 0 15px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .search {
      flex: 1;
      min-width: 200px;
      padding: 14px 20px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: var(--transition);
    }
    .search:focus { border-color: var(--primary); box-shadow: 0 0 30px var(--shadow); }
    .filter-select {
      padding: 14px 20px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text);
      font-size: 14px;
      outline: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .filter-select:focus { border-color: var(--primary); }

    /* ===== CONTAINER ===== */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 15px 40px;
    }
    .section { margin-top: 30px; }
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }
    .section-title span { color: var(--primary); }

    /* ===== GRID ===== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 24px 16px;
    }

    /* ===== CARD ===== */
    .card {
      background: var(--bg2);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      transition: var(--transition);
      border: 1px solid var(--border);
      position: relative;
    }
    .card:hover {
      transform: translateY(-8px);
      border-color: var(--primary);
      box-shadow: 0 12px 40px var(--shadow);
    }
    .card-cover {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: var(--bg3);
      pointer-events: none; /* Save မရအောင် */
      -webkit-user-drag: none; /* Drag မရအောင် */
      user-drag: none;
    }
    .card-body { padding: 12px 12px 14px; }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-genre {
      font-size: 11px;
      color: var(--text2);
      margin-top: 4px;
    }
    .badge-latest {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ===== MENU ===== */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      display: none;
      backdrop-filter: blur(4px);
    }
    .overlay.show { display: block; }
    .menu-panel {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100vh;
      background: var(--bg2);
      z-index: 300;
      padding: 30px 20px;
      transition: 0.3s;
      border-right: 1px solid var(--border);
    }
    .menu-panel.open { left: 0; }
    .menu-close {
      background: none;
      border: none;
      color: var(--text);
      font-size: 28px;
      float: right;
      cursor: pointer;
    }
    .menu-logo {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 30px 0 30px;
    }
    .menu-link {
      display: block;
      padding: 14px 6px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      transition: var(--transition);
    }
    .menu-link:hover { color: var(--primary); padding-left: 10px; }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 24px 15px;
      border-top: 1px solid var(--border);
      color: var(--text2);
      font-size: 13px;
      background: var(--bg2);
    }
    .footer span { color: var(--primary); }

    /* ===== EMPTY ===== */
    .empty {
      grid-column: 1/-1;
      text-align: center;
      color: var(--text2);
      padding: 50px 10px;
    }

    /* ===== MODAL ===== */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }
    .modal.show { display: flex; }
    .modal-box {
      background: var(--bg2);
      max-width: 420px;
      width: 100%;
      padding: 35px 30px;
      border-radius: 24px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .modal-box h2 { color: var(--primary); margin-bottom: 8px; }
    .modal-box p { color: var(--text2); margin-bottom: 18px; font-size: 14px; }
    .modal-box input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
      transition: var(--transition);
    }
    .modal-box input:focus { border-color: var(--primary); }
    .modal-box .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      border: none;
      border-radius: 40px;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: var(--transition);
    }
    .modal-box .btn-submit:hover { opacity: 0.9; transform: scale(1.02); }
    .modal-close {
      float: right;
      background: none;
      border: none;
      color: var(--text);
      font-size: 28px;
      cursor: pointer;
    }
    .modal-msg { margin-top: 14px; font-size: 14px; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .logo { font-size: 30px; }
      .grid { grid-template-columns: repeat(3, 1fr); gap: 16px 10px; }
      .card-body { padding: 8px 8px 10px; }
      .card-title { font-size: 12px; }
      .section-title { font-size: 18px; }
      .search-area { margin-top: 16px; }
    }
    @media (max-width: 400px) {
      .grid { grid-template-columns: repeat(2, 1fr); gap: 14px 8px; }
    }
  </style>
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="logo">ToonNest</div>
  </header>

  <!-- ===== NAV ===== -->
  <nav class="nav">
    <div class="nav-left">
      <button class="menu-btn" onclick="openMenu()">☰</button>
      <span class="nav-title" id="navTitle">Home</span>
    </div>
    <div class="nav-right">
      <button class="theme-btn" onclick="toggleTheme()" title="Dark/Light Mode">🌓</button>
      <button class="premium-btn" onclick="openModal()">👑 Premium</button>
    </div>
  </nav>

  <!-- ===== SEARCH + FILTER ===== -->
  <div class="search-area">
    <input class="search" id="searchInput" type="text" placeholder="🔍 Search Manhwa..." oninput="filterAll()">
    <select class="filter-select" id="genreFilter" onchange="filterAll()">
      <option value="all">All Genres</option>
      <option value="Action">Action</option>
      <option value="Romance">Romance</option>
      <option value="Fantasy">Fantasy</option>
      <option value="Horror">Horror</option>
      <option value="Comedy">Comedy</option>
      <option value="Drama">Drama</option>
    </select>
  </div>

  <!-- ===== MAIN ===== -->
  <main class="container">
    <section class="section">
      <div class="section-head">
        <div class="section-title">🆕 <span>Latest</span> Updates</div>
      </div>
      <div class="grid" id="latestGrid"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div class="section-title">📚 <span>All</span> Manhwa</div>
      </div>
      <div class="grid" id="allGrid"></div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    © 2026 <span>ToonNest</span>. All rights reserved.
  </footer>

  <!-- ===== MENU ===== -->
  <div class="overlay" id="overlay" onclick="closeMenu()"></div>
  <div class="menu-panel" id="menuPanel">
    <button class="menu-close" onclick="closeMenu()">×</button>
    <div class="menu-logo">ToonNest</div>
    <a class="menu-link" href="index.html">🏠 Home</a>
    <a class="menu-link" href="#" onclick="closeMenu(); document.getElementById('latestGrid').scrollIntoView({behavior:'smooth'});">🆕 Latest</a>
    <a class="menu-link" href="#" onclick="closeMenu(); document.getElementById('allGrid').scrollIntoView({behavior:'smooth'});">📚 All Manhwa</a>
    <a class="menu-link" href="#" onclick="closeMenu(); openModal();">👑 Premium</a>
  </div>

  <!-- ===== PREMIUM MODAL ===== -->
  <div class="modal" id="premiumModal">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">×</button>
      <h2>👑 Premium</h2>
      <p>Telegram Group မှ ရရှိသော Code ကို ထည့်ပါ။</p>
      <input type="text" id="premiumCode" placeholder="Code ထည့်ပါ...">
      <button class="btn-submit" onclick="verifyCode()">အတည်ပြုမယ်</button>
      <div class="modal-msg" id="premiumMsg"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // DATA
    // ============================================================
    let manhwaList = [];
    let allManhwa = [];

    // ============================================================
    // THEME
    // ============================================================
    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
    }

    // ============================================================
    // PREMIUM (One-Time Lifetime)
    // ============================================================
    const AVAILABLE_CODES = {
      "PREMIUM-001": true,
      "PREMIUM-002": true,
      "PREMIUM-003": true,
      "TEAM-2026": true
    };

    function isCodeUsed(code) {
      const usedCodes = JSON.parse(localStorage.getItem('usedCodes') || '[]');
      return usedCodes.includes(code);
    }

    function markCodeAsUsed(code) {
      const usedCodes = JSON.parse(localStorage.getItem('usedCodes') || '[]');
      usedCodes.push(code);
      localStorage.setItem('usedCodes', JSON.stringify(usedCodes));
    }

    function isPremium() {
      return localStorage.getItem('isPremium') === 'true';
    }

    function verifyCode() {
      const input = document.getElementById('premiumCode').value.trim();
      const msg = document.getElementById('premiumMsg');

      if (!AVAILABLE_CODES[input]) {
        msg.style.color = '#ff6b8a';
        msg.textContent = '❌ Code မှားနေပါသည်။';
        return;
      }

      if (isCodeUsed(input)) {
        msg.style.color = '#ff6b8a';
        msg.textContent = '❌ ဒီ Code ကို သုံးပြီးပါပြီ။';
        return;
      }

      localStorage.setItem('isPremium', 'true');
      markCodeAsUsed(input);

      msg.style.color = '#4caf50';
      msg.textContent = '✅ အောင်မြင်ပါပြီ! (Lifetime Premium)';
      setTimeout(() => { closeModal(); location.reload(); }, 1200);
    }

    function updateNav() {
      const title = document.getElementById('navTitle');
      title.innerHTML = isPremium() ? 'Home 👑' : 'Home';
    }

    function openModal() {
      document.getElementById('premiumModal').classList.add('show');
      document.getElementById('premiumMsg').textContent = '';
    }
    function closeModal() {
      document.getElementById('premiumModal').classList.remove('show');
    }

    // ============================================================
    // LOAD MANHWA
    // ============================================================
    async function loadManhwa() {
      try {
        const res = await fetch('manhwa.json');
        manhwaList = await res.json();
        allManhwa = [...manhwaList];
        renderLatest();
        renderAll();
      } catch {
        document.getElementById('latestGrid').innerHTML = `<div class="empty">⚠️ ဒေတာမရှိပါ</div>`;
      }
      updateNav();
    }

    // ============================================================
    // RENDER CARDS
    // ============================================================
    function createCard(manhwa, showBadge = false) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `manhwa.html?id=${manhwa.id}`;

      let badge = '';
      if (showBadge) {
        badge = `<span class="badge-latest">LATEST</span>`;
      }

      a.innerHTML = `
        ${badge}
        <img class="card-cover" src="${manhwa.cover}" alt="${manhwa.title}" loading="lazy" draggable="false" oncontextmenu="return false">
        <div class="card-body">
          <div class="card-title">${manhwa.title}</div>
          <div class="card-genre">${manhwa.genres ? manhwa.genres.slice(0,2).join(' • ') : ''}</div>
        </div>
      `;
      return a;
    }

    function renderLatest() {
      const grid = document.getElementById('latestGrid');
      grid.innerHTML = '';
      const latest = manhwaList.slice().reverse().slice(0, 6);
      latest.forEach((m, i) => {
        grid.appendChild(createCard(m, i === 0));
      });
    }

    function renderAll() {
      const grid = document.getElementById('allGrid');
      grid.innerHTML = '';
      manhwaList.forEach(m => {
        grid.appendChild(createCard(m, false));
      });
    }

    // ============================================================
    // SEARCH + FILTER
    // ============================================================
    function filterAll() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const genre = document.getElementById('genreFilter').value;

      let filtered = allManhwa.filter(m => {
        const matchTitle = m.title.toLowerCase().includes(keyword);
        const matchGenre = genre === 'all' || (m.genres && m.genres.includes(genre));
        return matchTitle && matchGenre;
      });

      const grid = document.getElementById('allGrid');
      grid.innerHTML = '';
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty">🔍 ရှာမတွေ့ပါ</div>`;
        return;
      }
      filtered.forEach(m => {
        grid.appendChild(createCard(m, false));
      });
    }

    // ============================================================
    // MENU
    // ============================================================
    function openMenu() {
      document.getElementById('menuPanel').classList.add('open');
      document.getElementById('overlay').classList.add('show');
    }
    function closeMenu() {
      document.getElementById('menuPanel').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    // ============================================================
    // START
    // ============================================================
    loadManhwa();

    // ============================================================
    // PREVENT SAVE (Right-click & Drag)
    // ============================================================
    document.addEventListener('contextmenu', (e) => {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
      }
    });
  </script>
</body>
  </html>
