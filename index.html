<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manhwa Myanmar</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

/* HEADER */
.header{
  background:#762765;
  text-align:center;
  padding:22px 10px 20px;
}

.logo{
  font-size:32px;
  font-weight:bold;
  margin-bottom:8px;
}

.subtitle{
  font-size:14px;
}

/* MENU */
.menu-bar{
  height:52px;
  background:#050505;
  border-bottom:1px solid #762765;

  display:flex;
  align-items:center;

  padding:0 18px;
  font-size:16px;
}

.menu-icon{
  font-size:24px;
  margin-right:8px;
}

/* SEARCH */
.search-box{
  padding:20px 15px 5px;
  max-width:1100px;
  margin:auto;
}

.search{
  width:100%;
  padding:12px 15px;
  border:none;
  outline:none;
  border-radius:5px;

  background:#1b1b1b;
  color:#fff;

  font-size:14px;
}

/* GRID */
.container{
  max-width:1100px;
  margin:auto;
  padding:20px 15px 50px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px 20px;
}

/* CARD */
.card{
  background:#762765;
  padding:9px;
  text-decoration:none;
  color:#fff;
  display:block;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.cover{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
  background:#222;
}

.title{
  text-align:center;
  font-size:14px;
  font-weight:bold;
  padding:9px 4px 5px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* MOBILE */
@media(max-width:700px){

  .logo{
    font-size:27px;
  }

  .subtitle{
    font-size:12px;
  }

  .grid{
    grid-template-columns:repeat(3,1fr);
    gap:25px 15px;
  }

  .card{
    padding:8px;
  }

  .title{
    font-size:12px;
  }
}

/* SMALL PHONE */
@media(max-width:380px){

  .grid{
    gap:18px 8px;
  }

  .card{
    padding:6px;
  }

  .title{
    font-size:11px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    Manhwa Myanmar
  </div>

  <div class="subtitle">
    ( Manhwa Collection )
  </div>

</header>

<div class="menu-bar">

  <span class="menu-icon">☰</span>
  <span>Menu</span>

</div>

<div class="search-box">

  <input
    class="search"
    id="search"
    type="text"
    placeholder="Search Manhwa..."
    oninput="searchManhwa()"
  >

</div>

<main class="container">

  <div class="grid" id="manhwaGrid"></div>

</main>

<script>

let manhwaList = [];

async function loadManhwa(){

  const response = await fetch("manhwa.json");

  manhwaList = await response.json();

  displayManhwa(manhwaList);

}

function displayManhwa(list){

  const grid =
    document.getElementById("manhwaGrid");

  grid.innerHTML = "";

  list.forEach(manhwa => {

    const card =
      document.createElement("a");

    card.className = "card";

    card.href =
      `reader.html?chapter=${manhwa.latestChapter}`;

    card.innerHTML = `

      <img
        class="cover"
        src="${manhwa.cover}"
        alt="${manhwa.title}"
        loading="lazy"
      >

      <div class="title">
        ${manhwa.title}
      </div>

    `;

    grid.appendChild(card);

  });

}

function searchManhwa(){

  const keyword =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const result =
    manhwaList.filter(manhwa =>
      manhwa.title
        .toLowerCase()
        .includes(keyword)
    );

  displayManhwa(result);

}

loadManhwa();

</script>

</body>
</html>
