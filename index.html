<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manhwa Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      text-align: center;
      padding: 25px 15px;
      background: #181818;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .header p {
      margin: 0;
      color: #aaa;
    }

    .chapters {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .chapter {
      display: block;
      background: #222;
      color: white;
      text-decoration: none;
      padding: 18px;
      margin-bottom: 10px;
      border-radius: 8px;
      font-size: 18px;
    }

    .chapter:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>My Manhwa</h1>
    <p>Choose a chapter to read</p>
  </div>

  <div class="chapters">

    <a class="chapter" href="chapter-1.html">
      Chapter 1
    </a>

    <a class="chapter" href="chapter-2.html">
      Chapter 2
    </a>

  </div>

</body>
</html>  </div>

</body>
</html>
