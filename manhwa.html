<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToonNest — Manhwa</title>

  <!-- ===== GOOGLE SEARCH CONSOLE VERIFICATION ===== -->
  <meta name="google-site-verification" content="YIVcFmhhCDeFFjVW1cz064eiEtNrl0iJ5vnDQ012Iq8" />

  <!-- ===== HILLTOPADS VERIFICATION ===== -->
  <meta name="d9bdb04dc39f3c78e37bf558f15df61458f35181" content="d9bdb04dc39f3c78e37bf558f15df61458f35181" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; transition: 0.3s; }
    :root {
      --bg: #0b0b0f;
      --bg2: #12121a;
      --bg3: #1a1a28;
      --border: #2a2a3a;
      --text: #eee;
      --text2: #aaa;
      --primary: #ff6b8a;
      --primary2: #d98ac8;
      --shadow: rgba(255,107,138,0.15);
    }
    .light {
      --bg: #f5f0f7;
      --bg2: #ffffff;
      --bg3: #f0ebf2;
      --border: #ddd;
      --text: #222;
      --text2: #555;
      --shadow: rgba(0,0,0,0.08);
    }
    body { background: var(--bg); color: var(--text); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    .noti-bar {
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      color: #fff;
      text-align: center;
      padding: 10px 40px 10px 15px;
      font-size: 13px;
      font-weight: 600;
      position: relative;
      display: block;
      cursor: pointer;
      transition: 0.3s;
    }
    .noti-bar:hover { filter: brightness(1.1); }
    .noti-bar.hide { display: none; }
    .noti-bar .close-noti {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }

    .header {
      background: linear-gradient(135deg, #1a0b1f, #2d1b33);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid var(--primary);
    }
    .logo {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back {
      display: inline-block;
      margin-top: 6px;
      color: var(--text2);
      text-decoration: none;
      font-size: 14px;
    }
    .back:hover { color: var(--primary); }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 15px 50px;
    }

    .info {
      display: flex;
      gap: 24px;
      margin-bottom: 30px;
      background: var(--bg2);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }
    .cover {
      width: 160px;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      background: var(--bg3);
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .details { flex: 1; }
    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .status {
      display: inline-block;
      background: var(--primary);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .desc {
      color: var(--text2);
      line-height: 1.7;
      margin-bottom: 14px;
      font-size: 15px;
    }
    .genres { display: flex; flex-wrap: wrap; gap: 8px; }
    .genre {
      background: var(--bg3);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin: 30px 0 16px;
    }
    .section-title span { color: var(--primary); }

    .chapter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-decoration: none;
      color: var(--text);
      transition: 0.2s;
    }
    .chapter:hover {
      background: var(--bg3);
      border-color: var(--primary);
    }
    .chapter-title { font-weight: 600; }
    .chapter-read { color: var(--primary); font-size: 14px; }
    .lock { color: var(--text2); margin-left: 8px; font-size: 13px; }

    @media (max-width: 600px) {
      .info { flex-direction: column; align-items: center; text-align: center; }
      .cover { width: 140px; height: 190px; }
      .title { font-size: 22px; }
      .noti-bar { font-size: 12px; padding: 9px 36px 9px 12px; }
    }
  </style>
</head>
<body>

  <div class="noti-bar" id="notiBar" onclick="goPremium()">
    <span>🎉 ToonNest မှ ကြိုဆိုပါတယ်! Premium ဝယ်ပြီး Ads ကင်းစင်စွာ ဖတ်ရှုပါ — ၅၀၀၀ ကျပ်</span>
    <button class="close-noti" onclick="event.stopPropagation(); closeNoti()">×</button>
  </div>

  <header class="header">
    <div class="logo">ToonNest</div>
    <a class="back" href="index.html">← Back to Home</a>
  </header>

  <main class="container" id="main"></main>

  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
    }

    function isPremium() {
      return localStorage.getItem('isPremium') === 'true';
    }

    function closeNoti() {
      document.getElementById('notiBar').classList.add('hide');
      sessionStorage.setItem('notiClosed', 'true');
    }
    function goPremium() {
      window.location.href = 'index.html';
    }
    if (sessionStorage.getItem('notiClosed') === 'true' || isPremium()) {
      document.getElementById('notiBar').classList.add('hide');
    }

    // ============================================================
    // HILLTOPADS — Premium မဟုတ်မှသာ Load လုပ်
    // ============================================================
    if (!isPremium()) {
      // Popunder Script
      (function(edjy){
        var d = document,
            s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];
        s.settings = edjy || {};
        s.src = "\/\/delicious-group.com\/c.Df9g6\/bP2\/5-lhSIWDQI9dNIzFQsx\/NUTegLyoOCSD0-3zNODmEc1\/OyDmMzzV";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';
        l.parentNode.insertBefore(s, l);
      })({});

      // In-Page Push Script
      (function(fpvm){
        var d = document,
            s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];
        s.settings = fpvm || {};
        s.src = "\/\/hospitableposition.com\/b\/XAVcs.dYG\/lB0QYzWccc\/Be\/mY9\/uIZzUhlIk\/PVTNcS0aMrTacjx\/NNTEcFtRNXzeQDx\/N-zkEZ2_MdQc";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';
        l.parentNode.insertBefore(s, l);
      })({});
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id')) || 1;

      const res = await fetch('manhwa.json');
      const list = await res.json();
      const manhwa = list.find(m => m.id === id);
      if (!manhwa) {
        document.getElementById('main').innerHTML = '<h2 style="text-align:center;padding:40px;">Manhwa not found</h2>';
        return;
      }

      const container = document.getElementById('main');

      let html = `
        <div class="info">
          <img class="cover" src="${manhwa.cover}" alt="${manhwa.title}">
          <div class="details">
            <div class="title">${manhwa.title}</div>
            <div class="status">${manhwa.status || 'Ongoing'}</div>
            <div class="desc">${manhwa.description || ''}</div>
            <div class="genres">${manhwa.genres.map(g => `<span class="genre">${g}</span>`).join('')}</div>
          </div>
        </div>
        <div class="section-title">📖 <span>Chapters</span></div>
      `;

      const chapters = manhwa.chapters || [];
      chapters.forEach(ch => {
        const isLocked = ch.number >= 10 && !isPremium();
        html += `
          <a class="chapter" href="${isLocked ? '#' : `reader.html?manhwa=${manhwa.id}&chapter=${ch.number}`}"
             onclick="${isLocked ? `alert('🔒 ဒီ Chapter က Premium ပါ။ Telegram Channel မှ ၅၀၀၀ ကျပ်နဲ့ ဝယ်ယူပါ။'); return false;` : ''}">
            <span class="chapter-title">${ch.title}</span>
            <span class="chapter-read">${isLocked ? '🔒 Locked' : 'Read →'}</span>
          </a>
        `;
      });

      container.innerHTML = html;
    }

    load();

    document.addEventListener('contextmenu', (e) => {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
