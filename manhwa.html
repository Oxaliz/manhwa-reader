<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToonNest — Manhwa</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b0f; color: #eee; font-family: 'Segoe UI', Arial, sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a24; }
    ::-webkit-scrollbar-thumb { background: #ff6b8a; border-radius: 10px; }

    .header {
      background: linear-gradient(135deg, #1a0b1f, #2d1b33);
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #ff6b8a;
    }
    .logo {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(90deg, #ff6b8a, #d98ac8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .back {
      display: inline-block;
      margin-top: 6px;
      color: #aaa;
      text-decoration: none;
      font-size: 14px;
    }
    .back:hover { color: #ff6b8a; }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 15px 50px;
    }

    .info {
      display: flex;
      gap: 24px;
      margin-bottom: 30px;
      background: #12121a;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #22223a;
    }
    .cover {
      width: 160px;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      background: #1a1a28;
    }
    .details { flex: 1; }
    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .status {
      display: inline-block;
      background: #ff6b8a;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .desc {
      color: #bbb;
      line-height: 1.7;
      margin-bottom: 14px;
      font-size: 15px;
    }
    .genres {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .genre {
      background: #22223a;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      border: 1px solid #33334a;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .section-title span { color: #ff6b8a; }

    .chapter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12121a;
      border: 1px solid #22223a;
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 10px;
      text-decoration: none;
      color: #fff;
      transition: 0.2s;
    }
    .chapter:hover {
      background: #1e1e30;
      border-color: #ff6b8a;
    }
    .chapter-title { font-weight: 600; }
    .chapter-read {
      color: #ff6b8a;
      font-size: 14px;
    }
    .lock {
      color: #888;
      margin-left: 8px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .info { flex-direction: column; align-items: center; text-align: center; }
      .cover { width: 140px; height: 190px; }
      .title { font-size: 22px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">ToonNest</div>
    <a class="back" href="index.html">← Back to Home</a>
  </header>

  <main class="container" id="main"></main>

  <script>
    // ===== PREMIUM CHECK =====
    function isPremium() {
      return localStorage.getItem('isPremium') === 'true';
    }

    // ===== LOAD =====
    async function load() {
      const params = new URLSearchParams(window.location.search);
      const id = parseInt(params.get('id')) || 1;

      const res = await fetch('manhwa.json');
      const list = await res.json();
      const manhwa = list.find(m => m.id === id);
      if (!manhwa) {
        document.getElementById('main').innerHTML = '<h2 style="text-align:center;padding:40px;">Manhwa not found</h2>';
        return;
      }

      const container = document.getElementById('main');

      // Info
      let html = `
        <div class="info">
          <img class="cover" src="${manhwa.cover}" alt="${manhwa.title}">
          <div class="details">
            <div class="title">${manhwa.title}</div>
            <div class="status">${manhwa.status || 'Ongoing'}</div>
            <div class="desc">${manhwa.description || ''}</div>
            <div class="genres">
              ${manhwa.genres.map(g => `<span class="genre">${g}</span>`).join('')}
            </div>
          </div>
        </div>
        <div class="section-title">📖 <span>Chapters</span></div>
      `;

      // Chapters
      const chapters = manhwa.chapters || [];
      chapters.forEach(ch => {
        const isLocked = ch.number > 1 && !isPremium();
        html += `
          <a class="chapter" href="${isLocked ? '#' : `reader.html?manhwa=${manhwa.id}&chapter=${ch.number}`}"
             onclick="${isLocked ? `alert('🔒 ဒီ Chapter က Premium ပါ။ Telegram Group မှ Code ရယူပါ။'); return false;` : ''}">
            <span class="chapter-title">${ch.title}</span>
            <span class="chapter-read">${isLocked ? '🔒 Locked' : 'Read →'}</span>
          </a>
        `;
      });

      container.innerHTML = html;
    }

    load();
  </script>

</body>
</html>
