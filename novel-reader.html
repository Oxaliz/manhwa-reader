<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToonNest — Novel Reader</title>

  <meta name="google-site-verification" content="YIVcFmhhCDeFFjVW1cz064eiEtNrl0iJ5vnDQ012Iq8" />
  <meta name="d9bdb04dc39f3c78e37bf558f15df61458f35181" content="d9bdb04dc39f3c78e37bf558f15df61458f35181" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Myanmar Text', sans-serif; transition: 0.3s; }
    :root {
      --bg: #0b0b0f; --bg2: #12121a; --bg3: #1a1a28;
      --border: #2a2a3a; --text: #eee; --text2: #aaa;
      --primary: #ff6b8a; --primary2: #d98ac8;
      --novel-bg: #0b0b0f; --novel-text: #eee;
    }
    .light { --bg: #f5f0f7; --bg2: #fff; --bg3: #f0ebf2; --border: #ddd; --text: #222; --text2: #555; }
    body { background: var(--bg); color: var(--text); }

    body.theme-dark { --novel-bg: #0b0b0f; --novel-text: #ddd; }
    body.theme-sepia { --novel-bg: #f4ecd8; --novel-text: #5b4636; }
    body.theme-light { --novel-bg: #ffffff; --novel-text: #222; }

    .progress {
      position: fixed; top: 0; left: 0;
      width: 0%; height: 3px;
      background: var(--primary); z-index: 9999;
    }

    .topbar {
      position: sticky; top: 0;
      background: var(--bg2); padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border); z-index: 100;
      flex-wrap: wrap; gap: 8px;
    }
    .topbar .logo {
      font-weight: 700; font-size: 16px;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .topbar button, .topbar select {
      background: var(--bg3); border: none; color: var(--text);
      padding: 8px 14px; border-radius: 30px; cursor: pointer; font-size: 13px;
    }
    .topbar select { border: 1px solid var(--border); }

    .settings-bar {
      max-width: 900px; margin: 12px auto 0; padding: 0 15px;
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .settings-bar button {
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--text); padding: 8px 14px; border-radius: 30px;
      cursor: pointer; font-size: 13px;
    }
    .settings-bar button:hover { border-color: var(--primary); }

    .chapter-title {
      text-align: center; padding: 24px 10px 8px;
      font-size: 24px; font-weight: 700;
    }

    .novel-content {
      max-width: 720px; margin: 20px auto;
      padding: 30px 25px;
      background: var(--novel-bg);
      color: var(--novel-text);
      border-radius: 12px;
      line-height: 1.9;
      font-size: 17px;
      white-space: pre-wrap;
      word-wrap: break-word;
      transition: 0.3s;
    }
    .novel-content.small { font-size: 15px; }
    .novel-content.medium { font-size: 17px; }
    .novel-content.large { font-size: 20px; }
    .novel-content.xlarge { font-size: 24px; }

    .ad-container {
      max-width: 720px; margin: 20px auto;
      padding: 12px; background: var(--bg2);
      border-radius: 12px; border: 1px solid var(--border);
      text-align: center; min-height: 250px;
      display: none; align-items: center; justify-content: center;
    }
    .ad-container.show { display: flex; }

    .bottom-nav {
      max-width: 900px; margin: auto;
      display: flex; gap: 12px;
      padding: 20px 15px 50px;
    }
    .bottom-nav button {
      flex: 1; padding: 14px;
      background: var(--bg3); border: none; border-radius: 30px;
      color: var(--text); font-weight: 600; cursor: pointer;
    }
    .bottom-nav button:hover { background: var(--border); }
    .bottom-nav button:disabled { opacity: 0.3; cursor: not-allowed; }

    .top-btn {
      position: fixed; right: 16px; bottom: 80px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--primary); border: none; color: #fff;
      font-size: 20px; cursor: pointer; display: none; z-index: 50;
    }

    @media (max-width: 600px) {
      .chapter-title { font-size: 20px; }
      .novel-content { padding: 20px 15px; font-size: 16px; }
    }
  </style>
</head>
<body class="theme-dark">

  <div class="progress" id="progress"></div>

  <div class="topbar">
    <button onclick="location.href='index.html'">⌂</button>
    <span class="logo">ToonNest</span>
    <select id="chapterSelect" onchange="changeChapter()"></select>
  </div>

  <div class="settings-bar">
    <button onclick="changeFontSize('small')">A-</button>
    <button onclick="changeFontSize('medium')">A</button>
    <button onclick="changeFontSize('large')">A+</button>
    <button onclick="changeFontSize('xlarge')">A++</button>
    <button onclick="cycleTheme()">🎨 Theme</button>
    <button onclick="changeLineHeight()">📏 Line</button>
    <button onclick="shareChapter()">🔗 Share</button>
  </div>

  <div class="chapter-title" id="chapterTitle">Loading...</div>

  <div class="ad-container" id="adBox">
    <script>
      (function(onx){
        var d = document, s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];
        s.settings = onx || {};
        s.src = "\/\/hospitableposition.com\/bpXmVSsMd.Gbl\/0IYiWxcx\/pemm\/9FuMZ\/UjleklPHTYcK0FMFT_cUxWOxD\/UYtzNqzJQ\/xQNZztEz4BO\/Qr";
        s.async = true;
        l.parentNode.insertBefore(s, l);
      })({});
    </script>
  </div>

  <div class="novel-content medium" id="content">Loading...</div>

  <div class="bottom-nav">
    <button id="prevBtn" onclick="prevChapter()">← Previous</button>
    <button id="nextBtn" onclick="nextChapter()">Next →</button>
  </div>

  <button class="top-btn" id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script>
    let novel, chapters, currentIndex = 0, novelId = 1;

    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');

    function isPremium() { return localStorage.getItem('isPremium') === 'true'; }

    if (!isPremium()) {
      (function(edjy){
        var d = document, s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];
        s.settings = edjy || {};
        s.src = "\/\/delicious-group.com\/c.Df9g6\/bP2\/5-lhSIWDQI9dNIzFQsx\/NUTegLyoOCSD0-3zNODmEc1\/OyDmMzzV";
        s.async = true;
        l.parentNode.insertBefore(s, l);
      })({});
      (function(fpvm){
        var d = document, s = d.createElement('script'),
            l = d.currentScript || d.scripts[d.scripts.length - 1];
        s.settings = fpvm || {};
        s.src = "\/\/hospitableposition.com\/b\/XAVcs.dYG\/lB0QYzWccc\/Be\/mY9\/uIZzUhlIk\/PVTNcS0aMrTacjx\/NNTEcFtRNXzeQDx\/N-zkEZ2_MdQc";
        s.async = true;
        l.parentNode.insertBefore(s, l);
      })({});
      document.getElementById('adBox').classList.add('show');
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      novelId = parseInt(params.get('novel')) || 100;
      const chapterNum = parseInt(params.get('chapter')) || 1;

      const res = await fetch('manhwa.json');
      const list = await res.json();
      novel = list.find(m => m.id === novelId && m.type === 'novel');
      if (!novel) { document.body.innerHTML = '<h2 style="padding:30px;">Novel not found</h2>'; return; }

      chapters = novel.chapters || [];
      currentIndex = chapters.findIndex(c => c.number === chapterNum);
      if (currentIndex < 0) currentIndex = 0;

      // 🔒 Chapter တစ်ခုချင်း Lock စစ်ဆေး
      if (chapters[currentIndex]?.premium === true && !isPremium()) {
        alert('🔒 ဒီ Chapter က Premium ပါ။ Telegram Channel မှ ၅၀၀၀ ကျပ်နဲ့ ဝယ်ပါ။');
        location.href = 'index.html';
        return;
      }

      setupSelect();
      loadChapter();
      updateButtons();
    }

    function setupSelect() {
      const sel = document.getElementById('chapterSelect');
      sel.innerHTML = '';
      chapters.forEach((ch, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        const lockIcon = (ch.premium === true && !isPremium()) ? ' 🔒' : '';
        opt.textContent = ch.title + lockIcon;
        sel.appendChild(opt);
      });
      sel.value = currentIndex;
    }

    async function loadChapter() {
      const ch = chapters[currentIndex];
      document.getElementById('chapterTitle').textContent = ch.title;

      const content = document.getElementById('content');
      content.textContent = 'Loading...';

      const textRes = await fetch(ch.content);
      const text = await textRes.text();
      content.textContent = text;

      localStorage.setItem('novel_last_' + novelId, ch.number);

      updateButtons();
      window.scrollTo(0, 0);
    }

    function changeChapter() {
      const idx = parseInt(document.getElementById('chapterSelect').value);
      const ch = chapters[idx];
      if (ch.premium === true && !isPremium()) {
        alert('🔒 Premium ပါ။');
        document.getElementById('chapterSelect').value = currentIndex;
        return;
      }
      location.href = `novel-reader.html?novel=${novelId}&chapter=${ch.number}`;
    }

    function prevChapter() {
      if (currentIndex > 0) {
        const ch = chapters[currentIndex - 1];
        location.href = `novel-reader.html?novel=${novelId}&chapter=${ch.number}`;
      }
    }
    function nextChapter() {
      if (currentIndex < chapters.length - 1) {
        const ch = chapters[currentIndex + 1];
        if (ch.premium === true && !isPremium()) {
          alert('🔒 နောက် Chapter က Premium ပါ။');
          return;
        }
        location.href = `novel-reader.html?novel=${novelId}&chapter=${ch.number}`;
      }
    }

    function updateButtons() {
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === chapters.length - 1;
    }

    // FONT SIZE
    function changeFontSize(size) {
      const content = document.getElementById('content');
      content.className = 'novel-content ' + size;
      localStorage.setItem('novel_fontsize', size);
    }
    const savedSize = localStorage.getItem('novel_fontsize') || 'medium';
    document.getElementById('content').className = 'novel-content ' + savedSize;

    // THEME
    function cycleTheme() {
      const body = document.body;
      if (body.classList.contains('theme-dark')) {
        body.classList.remove('theme-dark'); body.classList.add('theme-sepia');
        localStorage.setItem('novel_theme', 'sepia');
      } else if (body.classList.contains('theme-sepia')) {
        body.classList.remove('theme-sepia'); body.classList.add('theme-light');
        localStorage.setItem('novel_theme', 'light');
      } else {
        body.classList.remove('theme-light'); body.classList.add('theme-dark');
        localStorage.setItem('novel_theme', 'dark');
      }
    }
    const savedTheme = localStorage.getItem('novel_theme') || 'dark';
    document.body.className = document.body.className.replace(/theme-\w+/g, '') + ' theme-' + savedTheme;

    // LINE HEIGHT
    const lineHeights = ['1.5', '1.9', '2.3'];
    let lineIndex = parseInt(localStorage.getItem('novel_line') || '1');
    document.getElementById('content').style.lineHeight = lineHeights[lineIndex];
    function changeLineHeight() {
      lineIndex = (lineIndex + 1) % lineHeights.length;
      document.getElementById('content').style.lineHeight = lineHeights[lineIndex];
      localStorage.setItem('novel_line', lineIndex.toString());
    }

    // SHARE
    function shareChapter() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ title: document.title, url: url });
      } else {
        navigator.clipboard.writeText(url).then(() => alert('✅ Link copy လုပ်ပြီးပါပြီ။'));
      }
    }

    // PROGRESS
    window.addEventListener('scroll', () => {
      const st = window.scrollY;
      const dh = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById('progress').style.width = dh > 0 ? (st / dh) * 100 + '%' : '0%';
      document.getElementById('topBtn').style.display = st > 500 ? 'block' : 'none';
    });

    load();
  </script>

</body>
</html>
