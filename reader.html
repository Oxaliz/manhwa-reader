<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Reader</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

/* PROGRESS */

.progress{
  position:fixed;
  top:0;
  left:0;

  width:0%;
  height:3px;

  background:#ff4d6d;

  z-index:9999;
}

/* TOP BAR */

.topbar{
  position:sticky;
  top:0;

  height:55px;

  background:#151515;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 10px;

  z-index:1000;
}

.logo{
  font-weight:bold;
  font-size:15px;
}

button,
select{
  background:#292929;
  color:#fff;

  border:none;
  border-radius:5px;

  padding:8px 10px;
}

select{
  max-width:130px;
}

/* TITLE */

.chapter-title{
  text-align:center;

  padding:14px 10px;

  font-size:17px;
  font-weight:bold;
}

/* READER */

.reader{
  width:100%;
  max-width:900px;
  margin:auto;
}

.reader img{
  display:block;

  width:100%;
  height:auto;

  margin:0 auto;

  background:#111;
}

/* NAV */

.bottom-nav{
  max-width:900px;
  margin:auto;

  display:flex;
  gap:10px;

  padding:20px 10px 40px;
}

.bottom-nav button{
  flex:1;
}

/* TOP BUTTON */

.top-btn{
  position:fixed;

  right:15px;
  bottom:70px;

  width:45px;
  height:45px;

  border-radius:50%;

  background:#ff4d6d;

  font-size:20px;

  display:none;
}

/* MOBILE */

@media(max-width:600px){

  .logo{
    font-size:13px;
  }

  select{
    max-width:115px;
    font-size:12px;
  }

}

</style>

</head>

<body>

<div
  class="progress"
  id="progress"
></div>


<!-- TOP BAR -->

<div class="topbar">

  <button onclick="goHome()">
    ⌂
  </button>

  <div
    class="logo"
    id="logo"
  >
    Manhwa Myanmar
  </div>

  <select
    id="chapterSelect"
    onchange="changeChapter()"
  >
  </select>

</div>


<!-- CHAPTER TITLE -->

<div
  class="chapter-title"
  id="chapterTitle"
>
  Loading...
</div>


<!-- IMAGES -->

<div
  class="reader"
  id="reader"
>
</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">

  <button
    id="previous"
    onclick="previousChapter()"
  >
    ← Previous
  </button>

  <button
    id="next"
    onclick="nextChapter()"
  >
    Next →
  </button>

</div>


<!-- TOP -->

<button
  class="top-btn"
  id="topBtn"
  onclick="scrollToTop()"
>
  ↑
</button>


<script>

let manhwaList = [];

let manhwa;

let currentChapterIndex = 0;


/* ================= LOAD ================= */

async function loadData(){

  const response =
    await fetch("manhwa.json");

  manhwaList =
    await response.json();


  const params =
    new URLSearchParams(
      window.location.search
    );


  const manhwaId =
    parseInt(
      params.get("manhwa")
    ) || 1;


  const chapterNumber =
    parseInt(
      params.get("chapter")
    ) || 1;


  manhwa =
    manhwaList.find(
      item =>
        item.id === manhwaId
    );


  if(!manhwa){

    document.body.innerHTML =
      "<h2 style='padding:30px'>Manhwa not found.</h2>";

    return;

  }


  currentChapterIndex =
    manhwa.chapters.findIndex(
      chapter =>
        chapter.number === chapterNumber
    );


  if(currentChapterIndex < 0){

    currentChapterIndex = 0;

  }


  setup();

}


/* ================= SETUP ================= */

function setup(){

  document.getElementById("logo")
    .textContent =
      manhwa.title;


  createChapterSelector();

  loadChapter();

}


/* ================= CHAPTER SELECT ================= */

function createChapterSelector(){

  const select =
    document.getElementById(
      "chapterSelect"
    );


  select.innerHTML = "";


  manhwa.chapters.forEach(
    (chapter,index)=>{

      const option =
        document.createElement(
          "option"
        );


      option.value =
        index;


      option.textContent =
        chapter.title;


      select.appendChild(
        option
      );

    }
  );


  select.value =
    currentChapterIndex;

}


/* ================= LOAD CHAPTER ================= */

function loadChapter(){

  const chapter =
    manhwa.chapters[
      currentChapterIndex
    ];


  document.getElementById(
    "chapterTitle"
  ).textContent =
    chapter.title;


  const reader =
    document.getElementById(
      "reader"
    );


  reader.innerHTML = "";


  for(
    let i=1;
    i<=chapter.pages;
    i++
  ){

    const img =
      document.createElement(
        "img"
      );


    const number =
      String(i)
        .padStart(3,"0");


    img.src =
      `${chapter.folder}/${number}.jpg`;


    img.loading =
      "lazy";


    img.alt =
      `${manhwa.title} ${chapter.title} Page ${i}`;


    reader.appendChild(
      img
    );

  }


  updateButtons();


  window.scrollTo(0,0);

}


/* ================= CHANGE ================= */

function changeChapter(){

  const index =
    parseInt(
      document.getElementById(
        "chapterSelect"
      ).value
    );


  const chapter =
    manhwa.chapters[index];


  window.location.href =
    `reader.html?manhwa=${manhwa.id}&chapter=${chapter.number}`;

}


/* ================= PREVIOUS ================= */

function previousChapter(){

  if(
    currentChapterIndex > 0
  ){

    const chapter =
      manhwa.chapters[
        currentChapterIndex - 1
      ];


    window.location.href =
      `reader.html?manhwa=${manhwa.id}&chapter=${chapter.number}`;

  }

}


/* ================= NEXT ================= */

function nextChapter(){

  if(
    currentChapterIndex <
    manhwa.chapters.length - 1
  ){

    const chapter =
      manhwa.chapters[
        currentChapterIndex + 1
      ];


    window.location.href =
      `reader.html?manhwa=${manhwa.id}&chapter=${chapter.number}`;

  }

}


/* ================= BUTTONS ================= */

function updateButtons(){

  document.getElementById(
    "previous"
  ).style.visibility =
    currentChapterIndex === 0
      ? "hidden"
      : "visible";


  document.getElementById(
    "next"
  ).style.visibility =
    currentChapterIndex ===
    manhwa.chapters.length - 1
      ? "hidden"
      : "visible";

}


/* ================= HOME ================= */

function goHome(){

  window.location.href =
    "index.html";

}


/* ================= TOP ================= */

function scrollToTop(){

  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* ================= SCROLL ================= */

window.addEventListener(
  "scroll",
  ()=>{

    const scrollTop =
      window.scrollY;


    const docHeight =
      document.documentElement
        .scrollHeight
      - window.innerHeight;


    const percent =
      docHeight > 0
        ? (scrollTop / docHeight) * 100
        : 0;


    document.getElementById(
      "progress"
    ).style.width =
      percent + "%";


    document.getElementById(
      "topBtn"
    ).style.display =
      scrollTop > 500
        ? "block"
        : "none";

  }
);


loadData();

</script>

</body>
</html>
