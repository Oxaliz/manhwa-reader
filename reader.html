<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToonNest — Reader</title>

  <!-- ===== HILLTOPADS VERIFICATION ===== -->
  <meta name="d9bdb04dc39f3c78e37bf558f15df61458f35181" content="d9bdb04dc39f3c78e37bf558f15df61458f35181" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; transition: 0.3s; }
    :root {
      --bg: #0b0b0f;
      --bg2: #12121a;
      --bg3: #1a1a28;
      --border: #2a2a3a;
      --text: #eee;
      --primary: #ff6b8a;
      --primary2: #d98ac8;
    }
    .light {
      --bg: #f5f0f7;
      --bg2: #ffffff;
      --bg3: #f0ebf2;
      --border: #ddd;
      --text: #222;
    }
    body { background: var(--bg); color: var(--text); }

    .progress {
      position: fixed; top: 0; left: 0;
      width: 0%; height: 3px;
      background: var(--primary);
      z-index: 9999;
    }

    .topbar {
      position: sticky; top: 0;
      background: var(--bg2);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }
    .topbar .logo {
      font-weight: 700;
      font-size: 16px;
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .topbar button, .topbar select {
      background: var(--bg3);
      border: none;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
    }
    .topbar select { border: 1px solid var(--border); }

    .chapter-title {
      text-align: center;
      padding: 20px 10px;
      font-size: 20px;
      font-weight: 700;
    }

    .reader {
      max-width: 900px;
      margin: auto;
    }
    .reader img {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg3);
    }

    .bottom-nav {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 12px;
      padding: 20px 10px 50px;
    }
    .bottom-nav button {
      flex: 1;
      padding: 14px;
      background: var(--bg3);
      border: none;
      border-radius: 30px;
      color: var(--text);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .bottom-nav button:hover { background: var(--border); }
    .bottom-nav button:disabled { opacity: 0.3; cursor: not-allowed; }

    .top-btn {
      position: fixed;
      right: 16px;
      bottom: 80px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: none;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(255,107,138,0.3);
    }
    @media (max-width: 600px) {
      .topbar .logo { font-size: 14px; }
      .topbar button, .topbar select { font-size: 12px; padding: 6px 10px; }
      .chapter-title { font-size: 17px; }
    }
  </style>
</head>
<body>

  <div class="progress" id="progress"></div>

  <div class="topbar">
    <button onclick="location.href='index.html'">⌂</button>
    <span class="logo">ToonNest</span>
    <select id="chapterSelect" onchange="changeChapter()"></select>
  </div>

  <div class="chapter-title" id="chapterTitle">Loading...</div>

  <div class="reader" id="reader"></div>

  <div class="bottom-nav">
    <button id="prevBtn" onclick="prevChapter()">← Previous</button>
    <button id="nextBtn" onclick="nextChapter()">Next →</button>
  </div>

  <button class="top-btn" id="topBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script>
    let manhwa, chapters, currentIndex = 0, manhwaId = 1;

    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light');
    }

    function isPremium() {
      return localStorage.getItem('isPremium') === 'true';
    }

    async function load() {
      const params = new URLSearchParams(window.location.search);
      manhwaId = parseInt(params.get('manhwa')) || 1;
      const chapterNum = parseInt(params.get('chapter')) || 1;

      const res = await fetch('manhwa.json');
      const list = await res.json();
      manhwa = list.find(m => m.id === manhwaId);
      if (!manhwa) { document.body.innerHTML = '<h2 style="padding:30px;">Not found</h2>'; return; }

      chapters = manhwa.chapters || [];
      currentIndex = chapters.findIndex(c => c.number === chapterNum);
      if (currentIndex < 0) currentIndex = 0;

      if (chapters[currentIndex]?.number >= 10 && !isPremium()) {
        alert('🔒 ဒီ Chapter က Premium ပါ။ Telegram Channel မှ ၅၀၀၀ ကျပ်နဲ့ ဝယ်ယူပါ။');
        location.href = 'index.html';
        return;
      }

      setupSelect();
      loadChapter();
      updateButtons();
    }

    function setupSelect() {
      const sel = document.getElementById('chapterSelect');
      sel.innerHTML = '';
      chapters.forEach((ch, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = ch.title;
        sel.appendChild(opt);
      });
      sel.value = currentIndex;
    }

    function loadChapter() {
      const ch = chapters[currentIndex];
      document.getElementById('chapterTitle').textContent = ch.title;

      const reader = document.getElementById('reader');
      reader.innerHTML = '';
      for (let i = 1; i <= ch.pages; i++) {
        const img = document.createElement('img');
        const num = String(i).padStart(3, '0');
        img.src = `${ch.folder}/${num}.webp`;
        img.loading = 'lazy';
        img.draggable = false;
        img.oncontextmenu = () => false;
        reader.appendChild(img);
      }

      updateButtons();
      window.scrollTo(0, 0);
    }

    function changeChapter() {
      const idx = parseInt(document.getElementById('chapterSelect').value);
      const ch = chapters[idx];
      if (ch.number >= 10 && !isPremium()) {
        alert('🔒 Premium ဖြစ်ရန် လိုအပ်ပါသည်။');
        document.getElementById('chapterSelect').value = currentIndex;
        return;
      }
      location.href = `reader.html?manhwa=${manhwaId}&chapter=${ch.number}`;
    }

    function prevChapter() {
      if (currentIndex > 0) {
        const ch = chapters[currentIndex - 1];
        location.href = `reader.html?manhwa=${manhwaId}&chapter=${ch.number}`;
      }
    }
    function nextChapter() {
      if (currentIndex < chapters.length - 1) {
        const ch = chapters[currentIndex + 1];
        if (ch.number >= 10 && !isPremium()) {
          alert('🔒 နောက် Chapter က Premium ပါ။');
          return;
        }
        location.href = `reader.html?manhwa=${manhwaId}&chapter=${ch.number}`;
      }
    }

    function updateButtons() {
      document.getElementById('prevBtn').disabled = currentIndex === 0;
      document.getElementById('nextBtn').disabled = currentIndex === chapters.length - 1;
    }

    window.addEventListener('scroll', () => {
      const st = window.scrollY;
      const dh = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById('progress').style.width = dh > 0 ? (st / dh) * 100 + '%' : '0%';
      document.getElementById('topBtn').style.display = st > 500 ? 'block' : 'none';
    });

    load();

    document.addEventListener('contextmenu', (e) => {
      if (e.target.tagName === 'IMG') {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
